# render.yaml — TRK OS no Render (SERVIÇO ÚNICO).
# O backend builda e serve o frontend na mesma origem: 1 URL, sem CORS,
# sem configurar URL de API, sem Postgres/Redis/Worker.
#
# Após sincronizar este Blueprint, o app inteiro fica em portal-trk.onrender.com.
# Os serviços antigos (portal-trk-ui, -worker, -beat, -redis, -db) podem ser excluídos.

services:
  - type: web
    name: portal-trk
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # Banco: SQLite embutido (efêmero no plano free — re-semeia no boot).
      # Para dados persistentes depois, troque por um Postgres e sete DATABASE_URL.
