# render.yaml — TRK OS no Render (reaproveita os serviços existentes do portal-trk).
# Sem Redis/Worker/Beat — o app novo não depende deles.
# Os serviços antigos portal-trk-worker / -beat / -redis podem ser excluídos no painel.

databases:
  - name: portal-trk-db
    plan: free
    databaseName: portal_trk

services:
  # ─── API (FastAPI / TRK OS) ───
  - type: web
    name: portal-trk-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portal-trk-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: "*"

  # ─── Frontend (React SPA estática) ───
  - type: web
    name: portal-trk-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      # URL pública da API (ajuste se o nome do serviço for outro):
      - key: VITE_API_URL
        value: https://portal-trk-api.onrender.com/api
